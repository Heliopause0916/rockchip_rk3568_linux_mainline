# systemd-zram-generator 配置（trixie 1.2.1）
# 装包后 systemd 每次启动会解析本文件，自动创建 zram 设备并完成
# mkswap + swapon，无需手动 enable 任何服务。
# 语法依据：zram-generator.conf(5) 中 [zramN] 段的可用键。

[zram0]
# zram-size: 表达式，支持 "ram / 2" 表示物理内存一半
# （可用 min/max 等函数，如 min(ram / 2, 4096)）。此处使用物理内存一半。
zram-size = ram / 2
# compression-algorithm: 压缩算法名，与内核 defconfig 默认一致
# （CONFIG_ZRAM_DEF_COMP_LZORLE=y），避免加载 zstd 时多占内存；
# zstd 压缩率更高但解码更耗电/耗算力，对低功耗小内存板卡按默认 lzo-rle 即可。
compression-algorithm = lzo-rle
